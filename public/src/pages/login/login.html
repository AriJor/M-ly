<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="global.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Kirjaudu sisään</title>
    </head>

    <body>
        <div id="login-form">
            <b>Tervetuloa takaisin!</b>

            <form id="login-input-container">
                <div id="login-username">
                    <p>Käyttäjänimi</p>
                    <input type="text">
                </div>

                <div id="login-password">
                    <p>Salasana</p>
                    <input type="password">
                </div>

                <div id="login-give-data">
                    <button type="submit">Kirjaudu</button>
                </div>

                <div id="login-register-link">
                    <p>Eikö ole tiliä? </p>
                    <a href="../register/register.html">Registeröi</a>
                </div>
            </form>
        </div>
    </body>

    <script type="module" src="global.js"></script>
</html>
