<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="global.css">
        <title>Kirjaudu sisään</title>
    </head>

    <body>
        <div id="login-form">
            <b>Tervetuloa takaisin!</b>

            <div id="login-input-container">
                <div id="login-username">
                    <p>Käyttäjänimi</p>
                    <input type="text">
                </div>

                <div id="login-password">
                    <p>Salasana</p>
                    <input type="text">
                </div>

                <div id="login-give-data">
                    <button type="button">Kirjaudu</button>
                </div>

                <div id="login-register-link">
                    <p>Eikö ole tiliä? </p>
                    <a href="">Registeröi</a>
                </div>
            </div>
        </div>
    </body>

    <script type="module" src="global.js"></script>
</html>
