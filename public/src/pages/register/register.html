<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="global.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Kirjaudu sisään</title>
    </head>

    <body>
        <form id="register-form">
            <b>Rekisteröidy</b>

            <div id="register-input-container">
                <div id="register-username">
                    <p>Käyttäjänimi</p>
                    <input type="text">
                </div>

                <div id="register-password">
                    <p>Salasana</p>
                    <input type="text">
                </div>

                <div id="register-give-data">
                    <button id="register-button" type="submit">Luo tili</button>
                </div>

                <div id="register-register-link">
                    <p>Onko sinulla jo tili? </p>
                    <a href="../login/login.html">Kirjaudu sisään</a>
                </div>
            </div>
        </form>
    </body>

    <script type="module" src="global.js"></script>
</html>
